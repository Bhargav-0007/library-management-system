# App
spring.application.name=library
server.port=8088

# H2 Database (new file so the old single-tenant schema doesn't clash)
spring.datasource.url=jdbc:h2:file:./data/library-saas
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# H2 Console (dev only - disable in production)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT - override JWT_SECRET in any real environment (base64, >= 256 bits)
app.jwt.secret=${JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWtleS1jaGFuZ2UtbWUtaW4tcHJvZHVjdGlvbi0xMjM0NTY3OA==}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
